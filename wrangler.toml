name = "hesabyar-bot"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# پایگاه داده ابری کلادفلر (SQLite بر بستر Edge)
[[d1_databases]]
binding = "DB"
database_name = "hesabyar-db"
database_id = "" # در داشبورد کلادفلر یا متغیرهای ورکر ست شود

# متغیرهای پیش‌فرض عمومی
# توجه امنیتی: اطلاعات حساس (مثل BOT_TOKEN و GEMINI_API_KEY) را در داشبورد کلادفلر بخش Variables and Secrets ست کنید
[vars]
DEFAULT_ACCOUNT_NAME = "حساب اصلی"
